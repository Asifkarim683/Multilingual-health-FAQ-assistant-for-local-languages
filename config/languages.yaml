      refusal_dosage: "ମୁଁ ଔଷଧର ମାତ୍ରା ବା ରୋଗ ନିର୍ଣ୍ଣୟ ସମ୍ପର୍କରେ ପରାମର୍ଶ ଦେଇପାରିବି ନାହିଁ। ଦୟାକରି ପଞ୍ଜୀକୃତ ଡାକ୍ତରଙ୍କୁ ଦେଖାନ୍ତୁ।"
